# 🚀 Deploy the MkDocs site to GitHub Pages.
#
# Publishes automatically on every push to main, so merged content goes live
# without a manual step. Manual runs are still available via the Actions tab
# (type "deploy" to confirm) for re-publishing without a new commit.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/docs-check.yml'
      - 'remotion-lld/**'
      - '**/*.test.py'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

# Allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # Pushes to main always publish. Manual runs require the typed confirmation.
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: mkdocs build --strict
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
